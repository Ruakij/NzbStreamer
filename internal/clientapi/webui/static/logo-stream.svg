<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3.25 25.5 25.5" width="1024" height="1024" role="img" aria-label="NzbStreamer">
  <style>
    :root { color-scheme: light dark }
    g rect { fill: light-dark(#0b62f0, #5aa8ff) }
    .mid { fill: light-dark(#0f8fe0, #48c8f5) }
    .far { fill: light-dark(#12c2d6, #35e6e6) }
  </style>
  <defs>
    <linearGradient id="fade" x1="3" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="trail"><rect width="32" height="32" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#trail)">
    <rect class="far" x="6.5" y="5"     width="9"    height="3" rx="1.5"/>
    <rect class="far" x="17"  y="5"     width="3"    height="3" rx="1.5"/>

    <rect class="mid" x="5"   y="9.75"  width="10.5" height="3" rx="1.5"/>
    <rect class="mid" x="17"  y="9.75"  width="6.5"  height="3" rx="1.5"/>

    <rect             x="4"   y="14.5"  width="9.5"  height="3" rx="1.5"/>
    <rect             x="15"  y="14.5"  width="7"    height="3" rx="1.5"/>
    <rect             x="23.5" y="14.5" width="4"    height="3" rx="1.5"/>

    <rect class="mid" x="5.5" y="19.25" width="9"    height="3" rx="1.5"/>
    <rect class="mid" x="16"  y="19.25" width="5"    height="3" rx="1.5"/>

    <rect class="far" x="7"   y="24"    width="8.5"  height="3" rx="1.5"/>
    <rect class="far" x="17"  y="24"    width="2"    height="3" rx="1.5"/>
  </g>
</svg>
