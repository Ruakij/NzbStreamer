<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NzbStreamer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>NzbStreamer</h1>
  <span id="offline">disconnected</span>
  <label id="per-page-label">rows
    <select id="per-page">
      <option>10</option><option>25</option><option>50</option><option>100</option>
      <option value="0">all</option>
    </select>
  </label>
</header>

<div id="stats" hidden></div>

<form id="add">
  <input type="file" name="file" accept=".nzb" aria-label="nzb files" multiple required>
  <input type="text" name="category" placeholder="category" aria-label="category" size="10">
  <button type="submit" title="add the selected nzbs and start presenting them">Add</button>
  <button type="button" id="inspect" title="show what the parser makes of the selected nzbs without adding them">Inspect</button>
</form>

<dialog id="inspect-dialog">
  <div id="inspect-head">
    <div id="inspect-title"></div>
    <form method="dialog"><button aria-label="close" title="close">x</button></form>
  </div>
  <div id="inspect-body"></div>
</dialog>

<h2>Queue <span class="count" data-for="queue"></span></h2>
<table><thead><tr>
  <th data-key="name">Name<th data-key="category">Category<th data-key="stage">Stage
  <th data-key="bytes">Size<th data-key="cached">Cached
  <th data-key="age">Age<th data-key="read">Read<th>
</tr></thead><tbody id="queue"></tbody></table>
<div class="pager" data-for="queue" hidden>
  <span></span><button data-step="-1">Prev</button><button data-step="1">Next</button>
</div>

<h2>History <span class="count" data-for="history"></span> <label id="show-archived"><input type="checkbox"> archived</label></h2>
<table><thead><tr>
  <th data-key="name">Name<th data-key="category">Category<th data-key="stage">Stage
  <th data-key="bytes">Size<th data-key="cached">Cached
  <th data-key="age">Age<th data-key="read">Read<th>
</tr></thead><tbody id="history"></tbody></table>
<div class="pager" data-for="history" hidden>
  <span></span><button data-step="-1">Prev</button><button data-step="1">Next</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
