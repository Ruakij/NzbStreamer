<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NzbStreamer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>NzbStreamer</h1>
  <span id="offline">disconnected</span>
</header>

<form id="add">
  <input type="file" name="file" accept=".nzb" aria-label="nzb files" multiple required>
  <input type="text" name="category" placeholder="category" aria-label="category" size="10">
  <button type="submit">Add</button>
</form>

<h2>Queue</h2>
<table><thead><tr>
  <th data-key="name">Name<th data-key="category">Category<th data-key="stage">Stage
  <th data-key="bytes">Size<th data-key="age">Age<th>
</tr></thead><tbody id="queue"></tbody></table>

<h2>History</h2>
<table><thead><tr>
  <th data-key="name">Name<th data-key="category">Category<th data-key="stage">Stage
  <th data-key="bytes">Size<th data-key="age">Age<th>
</tr></thead><tbody id="history"></tbody></table>

<script src="/static/app.js"></script>
</body>
</html>
