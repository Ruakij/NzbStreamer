name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A CVE published after a merge is still our problem, so rescan daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run of the commit before it, so drop that one instead of
# waiting for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - gofmt -l cmd internal pkg | tee /dev/stderr | (! read)
          - go vet ./...
          - go test -race ./...
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ${{ matrix.check }}

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # Reachability-aware, so it only fails on vulnerabilities we actually call.
  # It installs its own Go, hence no setup-go step; go-version-input must be
  # cleared or it collides with go-version-file.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-version-input: ""

  # Source-tree scan: go.sum against the vulnerability databases trivy tracks,
  # plus committed secrets, which matter here because the config this project
  # takes is news server credentials.
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nzbstreamer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        # The yaml ignore file is not one of the paths trivy picks up on its own
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: nzbstreamer:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
